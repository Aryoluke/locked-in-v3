<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141416"><meta name="description" content="LOCKED IN V3 offline-first personal operating system"><title>LOCKED IN V3</title><link rel="stylesheet" href="styles.css"></head><body><div id="app" class="app-shell"><header class="topbar"><a class="brand" href="#dashboard"><span class="brand-mark">⌁</span><span>LOCKED <b>IN</b> <i>V3</i></span></a><div class="top-actions"><span id="save-status" class="save-status">LOCAL ONLY</span><button class="icon-btn" data-action="toggle-incognito" aria-label="Toggle incognito">◌</button><button class="icon-btn" data-action="open-settings" aria-label="Settings">⚙</button></div></header><main id="view" class="view"></main><nav class="bottom-nav" aria-label="Primary navigation"><button data-route="dashboard" class="nav-item active"><span>⌂</span>Today</button><button data-route="train" class="nav-item"><span>ϟ</span>Train</button><button data-route="nutrition" class="nav-item"><span>◈</span>Fuel</button><button data-route="mind" class="nav-item"><span>◉</span>Mind</button><button data-route="life" class="nav-item"><span>✦</span>Life</button><button data-route="squad" class="nav-item"><span>♛</span>Squad</button></nav></div><dialog id="onboarding"><form method="dialog" id="onboarding-form"><div class="eyebrow">YOUR OPERATING SYSTEM</div><h1>Lock in, <span class="accent">properly.</span></h1><p class="muted">Everything stays on this device. Personalise your system.</p><div class="form-grid"><label>Name<input name="name" required placeholder="What should we call you?"></label><label>Age<input name="age" type="number" min="13" max="100" placeholder="24"></label><label>Date of birth<input name="dob" type="date"></label><label>Height (cm)<input name="height" type="number" min="100" max="250" placeholder="180"></label><label>Weight (kg)<input name="weight" type="number" min="30" max="30
